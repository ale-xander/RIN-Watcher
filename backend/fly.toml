# fly.toml app configuration file generated for rin-watch-api-alex on 2026-11-11T09:29:10-08:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'rin-watch-api-alex'
primary_region = 'sjc'

# Non-secret runtime config. Secrets (FETCH_SECRET, ...) belong in
# `fly secrets set` — this file is committed to git.
[env]
  # SQLite file lives on the mounted volume (see [mounts]). Without this the app
  # falls back to /app/rin_watch.db inside the container, so the volume is never
  # used and every deploy/machine restart discards the fetched data.
  RIN_WATCH_DB = "/data/rin_watch.db"

  # Public origin of the deployed frontend, needed for CORS. Fill in once the
  # frontend URL is known (comma-separate several origins).
  # CORS_ORIGINS = "https://your-frontend.example"
  # FRONTEND_URL = "https://your-frontend.example"

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[mounts]
  source = "rin_data"
  destination = "/data"