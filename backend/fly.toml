# fly.toml app configuration file generated for rin-watch-api-alex on 2026-11-11T09:29:10-08:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'rin-watch-api-alex'
primary_region = 'sjc'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[mounts]
  source = "rin_data"
  destination = "/data"